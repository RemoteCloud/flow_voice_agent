# Flow Voice hub — deploy on the ai-playground host behind the shared Traefik + cloudflare-companion
# (same pattern as /opt/flowdeck). One container, one bundled file, no image build on the server.
#
# Server layout: /opt/flowvoice/{docker-compose.yml, hub.mjs, public/, data-template/, .env}
#   hub.mjs = dist/server.mjs, public/ = dist/public (npm run build), shipped with tar-over-ssh (README).
#   .env (chmod 600, never in git): HUB_SECRET, SESSION_SECRET, HUB_TENANT, HUB_MARANICS_HOST,
#   HUB_OIDC_ISSUER, HUB_OIDC_CLIENT_ID, HUB_OIDC_CLIENT_SECRET [, SERVICE_TOKENS, WEBHOOK_SECRET, …]
#
# Sign-in is Maranics UserManagement (OIDC). Register the redirect URI
#   https://flowvoice.operationcentric.com/api/auth/callback
# on the external application whose client id/secret are in .env.
#
# WebSockets (/v1/audio, /v1/events) pass through Traefik's HTTP router unchanged; Cloudflare proxies them too.
name: flowvoice

services:
  hub:
    image: node:22-alpine
    container_name: flowvoice-hub
    restart: unless-stopped
    working_dir: /app
    # seed portable config (stations.json, mappings.json, profiles/) on first start, then run
    command:
      - sh
      - -c
      - |
        for f in stations.json mappings.json; do [ -f /data/$$f ] || cp /app/data-template/$$f /data/$$f; done
        [ -d /data/profiles ] || cp -r /app/data-template/profiles /data/profiles
        exec node /app/hub.mjs
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - traefik_proxy
    volumes:
      - ./hub.mjs:/app/hub.mjs:ro
      - ./public:/app/public:ro
      - ./data-template:/app/data-template:ro
      - flowvoice-data:/data
    environment:
      NODE_ENV: production
      HUB_HOST: 0.0.0.0
      HUB_PORT: "8443"
      HUB_DATA_DIR: /data
      HUB_PUBLIC_DIR: /app/public
      HUB_PUBLIC_URL: https://flowvoice.operationcentric.com
      HUB_TRUST_PROXY: "1"
      VESSEL_ID: ${VESSEL_ID:-ai-playground}
      HUB_SECRET: ${HUB_SECRET:?set HUB_SECRET in /opt/flowvoice/.env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in /opt/flowvoice/.env}
      # Maranics tenant + API gateway host (Flows / Templates APIs under {host}/app/…)
      HUB_TENANT: ${HUB_TENANT:?set HUB_TENANT in /opt/flowvoice/.env}
      HUB_MARANICS_HOST: ${HUB_MARANICS_HOST:?set HUB_MARANICS_HOST in /opt/flowvoice/.env}
      HUB_FLOWS_BASE_URL: ${HUB_FLOWS_BASE_URL:-}
      HUB_TEMPLATES_BASE_URL: ${HUB_TEMPLATES_BASE_URL:-}
      HUB_UM_API_BASE_URL: ${HUB_UM_API_BASE_URL:-}
      HUB_ALLOWED_HOSTS: ${HUB_ALLOWED_HOSTS:-.fringeflow.com,.maranics-staging.com,.maranics.com}
      # UserManagement OIDC (redirect URI = ${HUB_PUBLIC_URL}/api/auth/callback unless overridden)
      HUB_OIDC_ISSUER: ${HUB_OIDC_ISSUER:?set HUB_OIDC_ISSUER in /opt/flowvoice/.env}
      HUB_OIDC_CLIENT_ID: ${HUB_OIDC_CLIENT_ID:?set HUB_OIDC_CLIENT_ID in /opt/flowvoice/.env}
      HUB_OIDC_CLIENT_SECRET: ${HUB_OIDC_CLIENT_SECRET:?set HUB_OIDC_CLIENT_SECRET in /opt/flowvoice/.env}
      HUB_OIDC_SCOPES: ${HUB_OIDC_SCOPES:-openid email profile offline_access}
      HUB_OIDC_REDIRECT_URI: ${HUB_OIDC_REDIRECT_URI:-}
      # Integrations: POST /v1/prompts, /v1/runs/trigger
      SERVICE_TOKENS: ${SERVICE_TOKENS:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Speech: default = on the endpoint (browser / Android). Optional server-side STT:
      STT_ENDPOINT: ${STT_ENDPOINT:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      TZ: ${TZ:-Europe/Oslo}
      TZ_MODE: ${TZ_MODE:-utc}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - "traefik.http.routers.flowvoice.entrypoints=https"
      - "traefik.http.routers.flowvoice.rule=Host(`flowvoice.operationcentric.com`)"
      - traefik.http.routers.flowvoice.service=flowvoice
      - traefik.http.services.flowvoice.loadbalancer.server.port=8443

volumes:
  flowvoice-data: {}

networks:
  traefik_proxy:
    external: true
