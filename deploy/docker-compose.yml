# Flow Voice on an edge node (vessel). One container, one port, one volume.
#   cp deploy/.env.example deploy/.env   (fill in HUB_SECRET, tenant, Maranics host, OIDC client)
#   docker compose -f deploy/docker-compose.yml up -d --build
name: flow-voice

services:
  flow-voice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: maranics/flow-voice:0.1
    container_name: flow-voice
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - flowvoice-data:/data
      # optional: extra STT/TTS models for a derived image, TLS certs
      # - ./models:/models:ro
      # - ./certs:/certs:ro
    env_file:
      - .env
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: "8443"
      HUB_DATA_DIR: /data
      HUB_PUBLIC_DIR: /app/public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # devices: ["/dev/snd:/dev/snd"]   # only when the container itself owns the audio hardware (profile A)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Speech on the hub ("server side sound"), profile `speech`:
  #   docker compose -f deploy/docker-compose.yml --profile speech up -d --build
  # plus in .env:  STT_BACKUP_ENDPOINT=http://stt:8080   TTS_ENDPOINT=http://tts:5000
  # The hub then reads every checklist with the same Piper voice on every computer, and a station set to
  # "speech is recognised on the hub" (Admin → Stations) streams the microphone to whisper.cpp instead of
  # using the browser's recogniser. Phones keep the agent's own speech; browsers without one use the hub's anyway.
  stt:
    build:
      context: ./whisper
    image: maranics/flow-voice-stt:0.1
    container_name: flow-voice-stt
    restart: unless-stopped
    profiles: ["speech"]
    volumes:
      # ggml-small-q5_1.bin (~190 MB) from https://huggingface.co/ggerganov/whisper.cpp/tree/main
      - ./models:/models:ro
    command: ["-m", "/models/ggml-small-q5_1.bin", "-t", "4"]
  tts:
    build:
      context: ./piper
    image: maranics/flow-voice-tts:0.1
    container_name: flow-voice-tts
    restart: unless-stopped
    profiles: ["speech"]

volumes:
  flowvoice-data: {}
