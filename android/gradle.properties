# On this Windows PC the JDK's AF_UNIX pipe fails under %LOCALAPPDATA%\Temp ("Unable to establish
# loopback connection"); jdk.net.unixdomain.tmpdir points the JVMs at a plain folder instead.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C\:/Users/MattiasLarsson/tools/tmp
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
