# Builds the Android agent and publishes the debug APK, so the latest build is always on GitHub:
#  - every push to main that touches android/ (or this file): rolling pre-release "android-latest"
#  - every tag android-*: a release of its own with the APK attached
#  - "Run workflow" by hand
name: Android agent

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the file
        id: apk
        run: |
          sha=$(git rev-parse --short HEAD)
          out="flow-voice-android-${sha}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
      - name: Rolling pre-release android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ steps.apk.outputs.file }}"
          notes="Debug-signed APK built from ${{ steps.apk.outputs.sha }} on $(date -u +%Y-%m-%d). Install with: adb install -r $f"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --target "$GITHUB_SHA" --notes "$notes" --title "Android agent, latest build"
            gh release upload android-latest "$f" --clobber
            # keep only the newest APK on the rolling release
            for old in $(gh release view android-latest --json assets -q '.assets[].name' | grep -v "^$f$"); do gh release delete-asset android-latest "$old" -y; done
          else
            gh release create android-latest "$f" --prerelease --target "$GITHUB_SHA" --title "Android agent, latest build" --notes "$notes"
          fi
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/android-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.file }}" --title "Android agent ${GITHUB_REF_NAME#android-}" --notes "Debug-signed APK built from ${{ steps.apk.outputs.sha }}."
